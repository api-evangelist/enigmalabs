aid: enigmalabs
name: Enigmalabs
description: >-
  Enigma Labs operates a crowdsourced platform for reporting, tracking, and analyzing unidentified
  aerial phenomena (UAP) and UFO sightings, positioning itself as a destination for UFO sighting
  alerts and aerial intelligence. Through a mobile app (iOS and Google Play) and a web platform with
  a map interface and sighting-submission flow, a global community of sky watchers contributes reports
  that the company enriches with data science, machine-learning analysis, real-time alerts, and
  historical context. Enigma Labs reports over 57,000 sightings, more than 570,000 sky watchers, and
  around 2,000 high-signal UAP events, and has been featured by NBC News, PBS Nova, Scientific
  American, The Guardian, and The New Yorker. It is a portfolio company of Kindred Ventures. No public
  API, developer portal, or developer documentation was found during enrichment; this profile captures
  the company's public web presence as a consumer-facing product rather than an API provider.
